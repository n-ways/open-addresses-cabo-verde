# One command: docker compose -f server/docker-compose.yml up -d
# (or, from this folder, docker compose up -d). The first start imports the
# registry into the "addresses" volume; later starts reuse it.
services:
  addresses:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: n-ways/addresses-cv
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Bearer keys allowed to issue and change codes, comma-separated. Leave
      # empty unless this deployment is the designated issuer (server/README.md).
      ISSUE_KEYS: "${ISSUE_KEYS:-}"
      ISSUE_PER_DAY: "${ISSUE_PER_DAY:-500}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    volumes:
      - addresses:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  addresses:
