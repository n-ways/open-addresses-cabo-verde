# OpenAPI description of the registry server (server/). Every example is a real response; see docs/api.md.
openapi: "3.1.0"
info:
  title: "N-Ways Addressing for Cabo Verde: registry API"
  version: "1"
  description: "Serves the published registry of Cabo Verde home codes and, on the designated issuer's deployment, issues new ones by the issuer's rules. Every example is a real response from a server running on the published registry. Guide: docs/api.md."
  license:
    name: "Apache-2.0 (code); ODbL-1.0 (data)"
    identifier: "Apache-2.0"
  contact:
    name: "N-WAYS LIMITED"
    email: "hello@nways.ng"
    url: "https://nways.ng"
servers:
  - url: "http://localhost:8080"
    description: "A local deployment (docker compose up)"
security:
  - {}
paths:
  /v1/areas:
    get:
      operationId: "areas"
      summary: "Areas by name"
      parameters:
        - name: "name"
          in: "query"
          required: true
          schema:
            type: "string"
          example: "Fazenda"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AreaSearch"
              examples:
                areas-by-name-one-name-five-places:
                  summary: "Areas by name (one name, five places)"
                  value:
                    name: "fazenda"
                    areas:
                      - id: "CR-078"
                        municipality: "CR"
                        plateName: "Fazenda"
                        officialName: "Achada Fazenda"
                        nameIndex: 534
                        needsCouncilChoice: false
                        codes: 309
                      - id: "PA-005"
                        municipality: "PA"
                        plateName: "Fazenda"
                        officialName: "Chã de Fazenda"
                        nameIndex: 534
                        needsCouncilChoice: false
                        codes: 59
                      - id: "PR-049"
                        municipality: "PR"
                        plateName: "Fazenda"
                        officialName: "Fazenda"
                        nameIndex: 534
                        needsCouncilChoice: false
                        codes: 229
                    count: 7
                an-official-name-finds-its-plate-name:
                  summary: "An official name finds its plate name"
                  value:
                    name: "Lote Achada São Filipe"
                    areas:
                      - id: "PR-024"
                        municipality: "PR"
                        plateName: "São Filipe"
                        officialName: "Lote Achada São Filipe"
                        nameIndex: 1221
                        needsCouncilChoice: true
                        codes: 585
                    count: 1
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                no-name-given:
                  summary: "No name given"
                  value:
                    error:
                      code: "bad_request"
                      message: "Give a place name: /v1/areas?name=Palmarejo"
        default:
          description: "Any other error, in the same shape"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /v1/areas/{id}:
    get:
      operationId: "area"
      summary: "One area"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
          example: "PR-004"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Area"
              examples:
                an-area:
                  summary: "An area"
                  value:
                    id: "PR-004"
                    municipality:
                      key: "PR"
                      name: "Praia"
                      island: "Santiago"
                    plateName: "Palmarejo"
                    officialName: "Palmarejo"
                    plateRule: "as-is"
                    needsCouncilChoice: false
                    aliases: []
                    near: "Monte Vermelho"
                    nameKey: "palmarejo"
                    nameIndex: 973
                    box:
                      - -23.53404
                      - 14.90097
                      - -23.51928
                      - 14.91902
                    anchor:
                      - 14.912684
                      - -23.526747
                    blocks:
                      - lo: 1000
                        hi: 3899
                    name:
                      plateName: "Palmarejo"
                      digits: 4
                      reserve:
                        - 5600
                        - 9999
                      blocks:
                        - zone: "PR-004"
                          lo: 1000
                          hi: 3899
                        - zone: "PR-006"
                          lo: 3900
                          hi: 5599
                      officialNames:
                        - "Palmarejo"
                        - "Palmarejo Grande"
                    codes: 938
                    byStatus:
                      provisional: 938
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                an-unknown-area:
                  summary: "An unknown area"
                  value:
                    error:
                      code: "unknown_area"
                      message: "There is no area 'PR-999'. Area ids look like PR-024."
        default:
          description: "Any other error, in the same shape"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /v1/at:
