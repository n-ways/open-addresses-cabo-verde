            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                a-bad-limit:
                  summary: "A bad limit"
                  value:
                    error:
                      code: "bad_request"
                      message: "limit is between 1 and 1000."
        default:
          description: "Any other error, in the same shape"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
components:
  securitySchemes:
    issuerKey:
      type: "http"
      scheme: "bearer"
      description: "An issuer key from ISSUE_KEYS. Only the designated issuer has keys."
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
              description: "Stable, for programs"
            message:
              type: "string"
              description: "For people"
          required:
            - "code"
            - "message"
        card:
          "$ref": "#/components/schemas/Card"
      required:
        - "error"
      description: "Every error. A refused issue for a building that already has a code also carries that code as \"card\"."
    Point:
      type: "object"
      properties:
        lat:
          type: "number"
        lng:
          type: "number"
      required:
        - "lat"
        - "lng"
    Postcode:
      type: "object"
      properties:
        value:
          type: "string"
        kind:
          type: "string"
          enum:
            - "area"
        source:
          type: "string"
      required:
        - "value"
        - "kind"
        - "source"
    Entrance:
      type: "object"
      properties:
        lat:
          type: "number"
        lng:
          type: "number"
        kind:
          type: "string"
          enum:
            - "gate"
            - "door"
            - "centre"
        source:
          type: "string"
          enum:
            - "map"
            - "people"
      required:
        - "lat"
        - "lng"
        - "kind"
        - "source"
    Written:
      type: "object"
      properties:
        big:
          type: "string"
          description: "The remembered form; alone it decodes"
        small:
          type: "string"
          description: "Municipality and island, printed for information"
        machine:
          type: "string"
        official:
          type: "string"
          description: "The official name, when it differs from the plate name"
      required:
        - "big"
        - "small"
        - "machine"
    Lote:
      type: "object"
      properties:
        use:
          type: "string"
        kind:
          type: "string"
        structures:
          type: "integer"
        floorAreaM2:
          type: "number"
        enclosed:
          type: "boolean"
      required:
        - "use"
        - "kind"
        - "structures"
        - "floorAreaM2"
        - "enclosed"
    Structure:
      type: "object"
      properties:
        index:
          type: "integer"
        id:
          type: "string"
        use:
          type: "string"
        confidence:
          type: "number"
        source:
          type: "string"
        status:
          type: "string"
        footprintM2:
          type: "number"
        perimeterM:
          type: "number"
        heightM:
          type: "number"
        heightSource:
          type: "string"
        floors:
          type: "integer"
        floorAreaM2:
          type: "number"
        name:
          type: "string"
          description: "Never on a home"
        data:
          type: "string"
          enum:
            - "osm"
            - "ml"
            - "people"
      required:
        - "index"
        - "id"
        - "use"
        - "confidence"
        - "source"
        - "status"
        - "footprintM2"
        - "perimeterM"
        - "floors"
        - "floorAreaM2"
        - "data"
    AreaRef:
      type: "object"
      properties:
        id:
          type: "string"
        plateName:
          type: "string"
        officialName:
          type: "string"
      required:
        - "id"
        - "plateName"
        - "officialName"
    Card:
      type: "object"
      properties:
        country:
          type: "string"
          const: "CV"
        machine:
          type: "string"
          examples:
            - "PR-0973-1234-0"
        home:
          type: "string"
          examples:
            - "Palmarejo 12 34"
        check:
          type: "integer"
          minimum: 0
          maximum: 9
        name:
          type: "string"
        officialName:
          type: "string"
        nameProvisional:
          type: "boolean"
        near:
          type: "string"
        area:
          "$ref": "#/components/schemas/AreaRef"
        municipality:
          type: "string"
        municipalityKey:
          type: "string"
        island:
          type: "string"
        coverage:
          type: "string"
          enum:
            - "official"
            - "official-pending"
        officialAddress:
          type: "string"
        postcode:
          "$ref": "#/components/schemas/Postcode"
        fullLine:
          type: "string"
        written:
          "$ref": "#/components/schemas/Written"
        spoken:
          type: "string"
        spokenKea:
          type: "string"
        status:
          type: "string"
          enum:
            - "provisional"
            - "confirmed"
            - "retired"
        issued:
          type: "string"
          enum:
            - "bulk"
            - "on-demand"
        issuedAt:
          type: "string"
          format: "date-time"
        entrance:
          "$ref": "#/components/schemas/Entrance"
        location:
          "$ref": "#/components/schemas/Point"
        plusCode:
          type: "string"
        plusCodeShort:
          type: "string"
        lote:
          "$ref": "#/components/schemas/Lote"
        structures:
          type: "array"
          items:
            "$ref": "#/components/schemas/Structure"
        registry:
          type: "object"
          properties:
            machine:
              type: "string"
            home:
              type: "string"
            official_name:
              type: "string"
            zone:
              type: "string"
            number:
              type: "string"
            check:
              type: "string"
            status:
              type: "string"
            issued:
              type: "string"
            issued_at:
              type: "string"
            entrance_lat:
              type: "string"
            entrance_lng:
              type: "string"
            entrance_kind:
              type: "string"
            plus_code:
              type: "string"
            use:
              type: "string"
            lote_kind:
              type: "string"
            structures:
              type: "string"
            floor_area_m2:
              type: "string"
            postcode:
              type: "string"
            coverage:
              type: "string"
            official_address:
              type: "string"
          description: "The registry row, every column as published"
        note:
          type: "string"
        credit:
          type: "string"
        creditUrl:
          type: "string"
          format: "uri"
      required:
        - "country"
        - "machine"
        - "home"
        - "check"
        - "name"
        - "nameProvisional"
        - "area"
        - "municipality"
        - "municipalityKey"
        - "island"
        - "fullLine"
        - "written"
        - "spoken"
        - "spokenKea"
        - "status"
        - "issued"
        - "issuedAt"
        - "entrance"
        - "location"
        - "plusCode"
        - "plusCodeShort"
        - "lote"
        - "structures"
        - "registry"
        - "credit"
        - "creditUrl"
    Health:
      type: "object"
      properties:
        status:
          type: "string"
          const: "ok"
        country:
          type: "string"
        codes:
          type: "integer"
        exported:
          type: "string"
          format: "date-time"
      required:
        - "status"
        - "country"
        - "codes"
        - "exported"
    Municipality:
      type: "object"
      properties:
        key:
          type: "string"
        iso:
          type: "string"
        name:
          type: "string"
        island:
          type: "string"
        postcode:
          "$ref": "#/components/schemas/Postcode"
        seat:
          type: "string"
        bbox:
          type: "array"
          items:
            type: "number"
          minItems: 4
          maxItems: 4
        codes:
          type: "integer"
        byStatus:
          type: "object"
          additionalProperties:
            type: "integer"
        areas:
          type: "integer"
      required:
        - "key"
        - "iso"
        - "name"
        - "island"
        - "seat"
        - "bbox"
        - "codes"
        - "byStatus"
        - "areas"
    Info:
      type: "object"
      properties:
        country:
          type: "string"
        name:
          type: "string"
        zones:
          type: "array"
          items:
            "$ref": "#/components/schemas/Municipality"
        counts:
          type: "object"
        registry:
          type: "object"
        licences:
          type: "object"
          properties:
            code:
              type: "string"
            data:
              type: "string"
            documents:
              type: "string"
        credit:
          type: "string"
        dataCredit:
          type: "string"
        creditUrl:
          type: "string"
        engine:
          type: "string"
        spec:
          type: "string"
        issuing:
          type: "boolean"
        example:
          type: "object"
    AreaSummary:
      type: "object"
      properties:
        id:
          type: "string"
        municipality:
          type: "string"
        plateName:
          type: "string"
        officialName:
          type: "string"
        nameIndex:
          type: "integer"
        needsCouncilChoice:
          type: "boolean"
        codes:
          type: "integer"
    MunicipalityDetail:
      allOf:
        - "$ref": "#/components/schemas/Municipality"
        - type: "object"
          properties:
            areaList:
              type: "array"
              items:
                "$ref": "#/components/schemas/AreaSummary"
    Block:
      type: "object"
      properties:
        zone:
          type: "string"
        lo:
          type: "integer"
        hi:
          type: "integer"
      required:
        - "lo"
        - "hi"
    Area:
      type: "object"
      properties:
        id:
          type: "string"
        municipality:
          type: "object"
          properties:
            key:
              type: "string"
            name:
              type: "string"
            island:
              type: "string"
        plateName:
          type: "string"
        officialName:
          type: "string"
        plateRule:
          type: "string"
        needsCouncilChoice:
          type: "boolean"
        aliases:
          type: "array"
          items:
            type: "string"
        near:
          type:
            - "string"
            - "null"
        nameKey:
          type: "string"
        nameIndex:
          type: "integer"
        box:
          type: "array"
          items:
            type: "number"
        anchor:
          type: "array"
          items:
            type: "number"
        blocks:
          type: "array"
          items:
            "$ref": "#/components/schemas/Block"
        name:
          type: "object"
          properties:
            plateName:
              type: "string"
            digits:
              type: "integer"
            reserve:
              type: "array"
              items:
                type: "integer"
            blocks:
              type: "array"
              items:
                "$ref": "#/components/schemas/Block"
            officialNames:
              type: "array"
              items:
                type: "string"
        codes:
          type: "integer"
        byStatus:
          type: "object"
          additionalProperties:
            type: "integer"
    AreaSearch:
      type: "object"
      properties:
        name:
          type: "string"
        areas:
          type: "array"
          items:
            "$ref": "#/components/schemas/AreaSummary"
        count:
          type: "integer"
    Find:
      type: "object"
      properties:
        query:
          type: "string"
        kind:
          type: "string"
          enum:
            - "home"
            - "machine"
            - "official"
            - "spot"
        matches:
          type: "array"
          items:
            "$ref": "#/components/schemas/Card"
        spot:
          "$ref": "#/components/schemas/SpotDecode"
      required:
        - "query"
        - "kind"
    At:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            - "found"
            - "none"
            - "outside"
        code:
          "$ref": "#/components/schemas/Card"
        distanceM:
          type: "number"
        canIssue:
          type: "boolean"
        building:
          type: "boolean"
        area:
          type: "object"
          properties:
            key:
              type: "string"
            name:
              type: "string"
            island:
              type: "string"
            bbox:
              type: "array"
              items:
                type: "number"
        spot:
          type: "string"
        note:
          type: "string"
      required:
        - "status"
    Near:
      type: "object"
      properties:
        lat:
          type: "number"
        lng:
          type: "number"
        radiusM:
          type: "number"
        count:
          type: "integer"
        codes:
          type: "array"
          items:
            type: "object"
            properties:
              machine:
                type: "string"
              home:
                type: "string"
              distanceM:
                type: "number"
              status:
                type: "string"
              use:
                type: "string"
              entrance:
                type: "object"
              plusCode:
                type: "string"
    Verify:
      type: "object"
      properties:
        code:
          type: "string"
        syntax:
          type: "boolean"
        checkDigit:
          type:
            - "boolean"
            - "null"
        issued:
          type: "boolean"
        machine:
          type: "string"
        status:
          type: "string"
        home:
          type: "string"
        issuedAt:
          type: "string"
        reason:
          type: "string"
      required:
        - "code"
        - "syntax"
        - "checkDigit"
        - "issued"
    Bounds:
      type: "object"
      properties:
        south:
          type: "number"
        west:
          type: "number"
        north:
          type: "number"
        east:
          type: "number"
    Spot:
      type: "object"
      properties:
        lat:
          type: "number"
        lng:
          type: "number"
        code:
          type: "string"
        code10:
          type: "string"
        short:
          type: "string"
        municipality:
          type: "string"
        municipalityKey:
          type: "string"
        island:
          type: "string"
        postcode:
          "$ref": "#/components/schemas/Postcode"
        bounds:
          "$ref": "#/components/schemas/Bounds"
    SpotDecode:
      type: "object"
      properties:
        code:
          type: "string"
        lat:
          type: "number"
        lng:
          type: "number"
        bounds:
          "$ref": "#/components/schemas/Bounds"
        municipality:
          type: "string"
        municipalityKey:
          type: "string"
        island:
          type: "string"
        at:
          "$ref": "#/components/schemas/At"
    CodePage:
      type: "object"
      properties:
        zone:
          type: "string"
        count:
          type: "integer"
        next:
          type:
            - "string"
            - "null"
        codes:
          type: "array"
          items:
            type: "object"
            properties:
              machine:
                type: "string"
              home:
                type: "string"
              area:
                type: "string"
              number:
                type: "integer"
              status:
                type: "string"
              lat:
                type: "number"
              lng:
                type: "number"
              plusCode:
                type: "string"
              use:
                type: "string"
    IssueRequest:
      type: "object"
      properties:
        lat:
          type: "number"
        lng:
          type: "number"
        outline:
          type: "array"
          items:
            type: "array"
            items:
              type: "number"
            minItems: 2
            maxItems: 2
          description: "The building outline, [lng, lat] points"
        of:
          type: "string"
          description: "Machine code of the lote this is another door of"
      required:
        - "lat"
        - "lng"
    ChangeRequest:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            - "provisional"
            - "confirmed"
            - "retired"
        entrance:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
            kind:
              type: "string"
              enum:
                - "gate"
                - "door"
                - "centre"
          required:
            - "lat"
            - "lng"
